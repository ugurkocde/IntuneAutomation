name: Script Analysis and Azure Template Generation
run-name: Script Analysis and Azure Template Generation

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  analyze-and-generate:
    runs-on: ubuntu-latest
    name: Analyze Scripts and Generate Azure Templates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install Analysis Tools
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Write-Host "PSScriptAnalyzer installed successfully"
          Write-Host "ShellCheck version: $(shellcheck --version)"

      - name: Run script tests
        shell: pwsh
        run: pwsh -NoProfile .github/scripts/run-script-tests.ps1 -GateOnLint

      - name: Generate Azure ARM Templates
        shell: pwsh
        run: pwsh -NoProfile .github/scripts/generate-azure-templates.ps1

      - name: Validate Azure ARM Templates
        shell: pwsh
        run: pwsh -NoProfile .github/scripts/test-azure-templates.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate MCP script index
        run: |
          # Deterministic timestamp from the current commit so the index only
          # changes when scripts change (avoids empty daily-cron commits).
          export SOURCE_DATE="$(git log -1 --format=%cI)"
          node mcp/scripts/generate-index.mjs

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: script-analysis-results
          path: |
            testresults.json
            script-tests.json

      - name: Commit all results (if on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "$(git log -1 --format=%ae)"
          git config --local user.name "GitHub Action"
          git add testresults.json script-tests.json azure-templates/ azure-deployment-templates.json mcp/data/scripts-index.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update script analysis results and Azure deployment templates [skip ci]"
            git push
          fi
